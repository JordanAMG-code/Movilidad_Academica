<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del estudiante</title>
</head>
<body>
    <div class="UDCLOGO">
        <img src="UDC-logo.png" width="200" alt="Logo de la Universidad de Colima">
    </div>
    
    <div class="DatosEstudiante">
        <h2>Ingrese sus datos</h2>
        <label for="numcuenta"></label>
        <input type="number" autocomplete="on" placeholder="Ingrese su número de cuenta"><br>
        <input type="password" autocomplete="on" placeholder="Ingrese su contraseña">
    </div>

    <div class="BotonEstudiante">
            <button type="button">Ingresar a la página</button>
    </div>
</body>
<footer>
    <div class="pertinenciaudc">
        <img src="" alt="">
    </div>
</footer>
</html>
