<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del estudiante</title>
    <link rel="stylesheet" href="styles.css">
    <script src="Funciones.js"></script>
</head>
<body>
    <header class="header-logo">
        <img src="Carpetadeimagenes/UDC-logo.png" alt="Logo UCOL">
    </header> 
    <div class="DatosEstudiante">
        <h2>Ingrese sus datos</h2>
        <label for="numcuenta"></label>
        <input type="numberaccount" autocomplete="on" placeholder="Ingrese su número de cuenta" required><br>
        <input type="password" autocomplete="on" placeholder="Ingrese su contraseña" required>
    </div>

    <nav class="menu-botones">
        <button id="BotonIngresar" type="button">Ingresar a la página</button>
    </nav>
</body>
<footer>
        <img src="Carpetadeimagenes/pertenenciaudc.png" alt="Pertinencia que transforma">
</footer>

</html>
